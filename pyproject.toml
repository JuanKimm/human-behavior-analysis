[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-r01-fall-inference"
version = "0.2.1"
description = "DD-R01 file-based fall-risk inference module"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.2.6",
  "opencv-python==4.11.0.86",
  "ultralytics==8.4.70",
  "torch>=2.11,<2.14",
  "torchvision>=0.26,<0.29",
  "scikit-learn>=1.6,<2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
